env:
  PROJECT_NAME: extension

# FILE GENERATED WITH: npx ghat fregante/ghatemplates/webext
# SOURCE: https://github.com/fregante/ghatemplates
# Since diverged: the build emits one package per browser under distribution/.

name: Release
on:
  workflow_dispatch: null
jobs:
  Bridge:
    name: Build (macOS bridge)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the universal calendar bridge
        working-directory: bridge
        run: |
          # macOS 14 is the floor: EventKit's requestFullAccessToEvents needs it.
          for arch in arm64 x86_64; do
            swiftc -O -framework EventKit \
              -target "$arch-apple-macos14" \
              calendar-bridge.swift -o "calendar-bridge-$arch"
          done
          lipo -create -output calendar-bridge calendar-bridge-arm64 calendar-bridge-x86_64
          lipo -info calendar-bridge
          # Ad-hoc signature: not notarized, but keeps macOS from killing the
          # binary outright once the user clears the quarantine attribute.
          codesign --force --sign - calendar-bridge
          # Zip here so the executable bit survives the artifact round-trip.
          zip -j calendar-bridge-macos.zip calendar-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: bridge/calendar-bridge-macos.zip
  Version:
    needs: Bridge
    outputs:
      created: ${{ env.DAILY_VERSION_CREATED }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test and build
        run: npm test
      - name: Create tag if necessary
        uses: fregante/daily-version-action@v2
      - name: Update each manifest.json with version ${{ env.DAILY_VERSION}}
        if: env.DAILY_VERSION_CREATED
        run: |
          for manifest in distribution/*/manifest.json; do
            npx dot-json@1 "$manifest" version "$DAILY_VERSION"
          done
      - name: Ready for "submit" jobs
        if: env.DAILY_VERSION_CREATED
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: distribution
      - name: Download the macOS bridge
        if: env.DAILY_VERSION_CREATED
        uses: actions/download-artifact@v4
        with:
          name: bridge
      - name: Create release
        if: env.DAILY_VERSION_CREATED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          root="$PWD"
          assets=()
          for browser in distribution/*/; do
            name=$(basename "$browser")
            filename="$PROJECT_NAME-$name-$DAILY_VERSION-for-local-testing-only.zip"
            (cd "$browser" && zip -r "$root/$filename" ./*)
            assets+=("$filename")
          done
          bridge="calendar-bridge-macos-$DAILY_VERSION.zip"
          mv calendar-bridge-macos.zip "$bridge"
          assets+=("$bridge")
          gh release create "$DAILY_VERSION" --generate-notes "${assets[@]}"
