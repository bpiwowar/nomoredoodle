<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Team offsite planning</title>
		<style>
			body {
				margin: 0;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
				color: #111827;
				background: #fff;
			}

			/* Clear of the overlay, whose width depends on the tab it is showing. */
			#poll {
				width: 330px;
				margin-left: var(--poll-left, 928px);
				padding-top: 24px;
			}

			#poll h1 {
				font-size: 22px;
				margin: 0 0 4px;
			}

			#poll p {
				margin: 0 0 16px;
				color: #6b7280;
				font-size: 14px;
			}

			#poll ul {
				list-style: none;
				margin: 0;
				padding: 0;
			}

			#poll li {
				display: flex;
				align-items: center;
				gap: 12px;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				padding: 9px 12px;
				margin-bottom: 7px;
				font-size: 14px;
			}
		</style>
	</head>
	<body>
		<main id="poll">
			<h1>Team offsite planning</h1>
			<p>Pick every slot that works for you.</p>
			<ul id="poll-slots"></ul>
		</main>
		<script type="module" src="overlay.ts"></script>
	</body>
</html>
